name: Compilar EXE para Windows

on:
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 opencv-python numpy matplotlib pyinstaller

    - name: Generar ejecutable con PyInstaller
      run: |
        pyinstaller --noconsole --onefile --windowed --name="ProcesamientoImagenes" interfaz.py

    - name: Subir el archivo EXE generado
      uses: actions/upload-artifact@v4
      with:
        name: ProcesamientoImagenes-Windows
        path: dist/ProcesamientoImagenes.exe
